<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a2e;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 320px;
      padding: 20px;
      background: #16213e;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }

    .display {
      width: 100%;
      height: 80px;
      margin-bottom: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      font-size: 36px;
      text-align: right;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      background: #293653;
      color: white;
      font-size: 22px;
      cursor: pointer;
      transition: 0.15s;
    }

    button:hover {
      background: #3b4a6b;
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background: #f59e0b;
    }

    .operator:hover {
      background: #d97706;
    }

    .clear {
      background: #ef4444;
    }

    .clear:hover {
      background: #dc2626;
    }

    .equals {
      background: #22c55e;
    }

    .equals:hover {
      background: #16a34a;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <input
      type="text"
      id="display"
      class="display"
      value="0"
      readonly
    >

    <div class="buttons">

      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button onclick="percentage()">%</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <button onclick="addNumber('7')">7</button>
      <button onclick="addNumber('8')">8</button>
      <button onclick="addNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="addNumber('4')">4</button>
      <button onclick="addNumber('5')">5</button>
      <button onclick="addNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="addNumber('1')">1</button>
      <button onclick="addNumber('2')">2</button>
      <button onclick="addNumber('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button class="zero" onclick="addNumber('0')">0</button>
      <button onclick="addDecimal()">.</button>
      <button class="equals" onclick="calculate()">=</button>

    </div>
  </div>

  <!-- JavaScript file -->
  <script src="script.js"></script>

</body>
</html>
